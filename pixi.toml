[workspace]
name = "birtistic"
version = "0.1.0"
description = "Making Bayesian Item Response Theory models faster with amortised inference"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# ============================================================================
# Base dependencies (shared by all environments).
#
# Compilers + CmdStan are needed by ``cmdstanpy`` (Python bindings); no R is
# installed on the ``main`` branch. The Villaveces et al PCM preprint
# analyses live on the ``Colombia-analysis-pcm`` branch, which carries its
# own R-only ``pixi.toml``.
# ============================================================================
[dependencies]
compilers = "*"
make = "*"
cmake = "*"

# CmdStan (driven from Python via ``cmdstanpy``).
cmdstan = "==2.37.0"

# Python's xarray / arviz ecosystem.
zarr = ">=2.5,<3"
h5netcdf = ">=1.8.1,<2"
openpyxl = ">=3.1.5,<4"

# ============================================================================
# Python feature (used by both ``default`` and ``mps-experimental``)
# ============================================================================
[feature.python.dependencies]
python = ">=3.13,<3.14"
pip = "*"

# Core scientific stack (scipy pinned for JAX compatibility).
numpy = "*"
scipy = ">=1.12"
pandas = "*"
matplotlib = "*"

# Probabilistic programming.
cmdstanpy = "*"

# Plotting.
plotnine = "*"

# Testing + interactive use.
pytest = "*"
pytest-cov = "*"
jupyterlab = "*"
ipykernel = "*"
arviz = ">=0.23.4,<0.24"

[feature.python.pypi-dependencies]
ggsci = ">=2.0.0, <3"
jax = "==0.10.0"
jaxlib = "==0.10.0"
numpyro = "==0.21.0"
flax = ">=0.10"
optax = ">=0.2.4"

# ============================================================================
# Experimental Python feature (JAX MPS stack)
# ============================================================================
[feature.python-mps.dependencies]
python = ">=3.13,<3.14"
pip = "*"
numpy = "*"
scipy = ">=1.12"
pandas = "*"
matplotlib = "*"
cmdstanpy = "*"
plotnine = "*"
pytest = "*"
pytest-cov = "*"
jupyterlab = "*"
ipykernel = "*"
arviz = ">=0.23.4,<0.24"

[feature.python-mps.pypi-dependencies]
ggsci = ">=2.0.0, <3"
jax = "==0.10.0"
jaxlib = "==0.10.0"
numpyro = "==0.21.0"
flax = ">=0.10"
optax = ">=0.2.4"

# ============================================================================
# Environment definitions
# ============================================================================
[environments]
# Default: full Python stack (Python + JAX + NumPyro + cmdstanpy) for
# the interim-analysis benchmarks (§3.1 Binomial, §3.3 MVN) and the IRT
# analyses.
default = { features = ["python"], solve-group = "default" }

# Experimental: same Python stack with the JAX MPS backend.
mps-experimental = { features = ["python-mps"], solve-group = "mps-experimental" }

# ============================================================================
# Tasks
# ============================================================================

[tasks]

# Verify Python environment with CmdStan + 8 schools example.
verify-python = """python test/python/test_environment.py"""

# Complete Python setup.
setup-python = { depends-on = ["verify-python"] }

# Install JAX MPS plugin in the mps-experimental environment.
# Run with: pixi run -e mps-experimental install-jax-mps
install-jax-mps = """python -m pip install jax-mps==0.10.1"""

# Verify that JAX sees the MPS backend.
# Run with: pixi run -e mps-experimental verify-mps
verify-mps = """python -c 'import jax; print("default_backend:", jax.default_backend()); print("devices:", jax.devices())'"""

# Convenience task for mps-experimental environment.
mps-setup = { depends-on = ["install-jax-mps", "verify-mps"] }
